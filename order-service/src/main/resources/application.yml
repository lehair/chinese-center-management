server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app.rabbitmq.queue: "order-queue"
app.rabbitmq.exchange: "chinese-center-exchange"
app.rabbitmq.routing-key: "order-routing-key"

# VNPay Sandbox Configuration
vnpay:
  payUrl: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
  returnUrl: "http://localhost:8084/api/orders/vnpay-return"
  tmnCode: ${VNPAY_TMN_CODE:"YOUR_TMN_CODE"} # Replace with real sandbox TMN Code
  hashSecret: ${VNPAY_HASH_SECRET:"YOUR_HASH_SECRET"} # Replace with real sandbox Hash Secret
  apiUrl: "https://sandbox.vnpayment.vn/merchant_webapi/api/transaction"
